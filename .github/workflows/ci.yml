name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Clickpath.slnx --configuration Release
      - name: Unit tests
        run: dotnet test tests/Clickpath.Tests/Clickpath.Tests.csproj --configuration Release --no-build
